# Builds, signs and publishes a release when a version tag (v1.2.3) is pushed.
# Run .\release.ps1 1.2.3 locally to bump the version and push the tag.
#
# The release is created as a DRAFT: test the installer, then press
# "Publish release" on GitHub. Only then do installed copies see the update.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of .secrets\sanscribe-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of .secrets\sanscribe-updater.key.password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Engine tests
        run: cargo test --manifest-path core/Cargo.toml

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Sanscribe v__VERSION__
          releaseBody: |
            Download the **x64-setup.exe** below and run it (no admin rights needed).
            Installed copies of Sanscribe offer this update automatically.
          releaseDraft: true
          prerelease: false
