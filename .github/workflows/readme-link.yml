# After a release is published, point the README download button at its installer.
name: Update download link

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update README
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="${TAG#v}"
          sed -i -E \
            -e "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/Sanscribe_[0-9]+\.[0-9]+\.[0-9]+_x64-setup\.exe#releases/download/v${V}/Sanscribe_${V}_x64-setup.exe#g" \
            -e "s#Download Sanscribe [0-9]+\.[0-9]+\.[0-9]+ for Windows#Download Sanscribe ${V} for Windows#g" \
            README.md
          if git diff --quiet; then echo "README already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README: download link for ${TAG}"
          git push
